name: Actions Storage Cleanup

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/actions-storage-cleanup.yml'

permissions:
  actions: write
  contents: read

concurrency:
  group: actions-storage-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: Clean old Actions history, artifacts and caches
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Clean GitHub Actions storage and old run history
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          repo="$GITHUB_REPOSITORY"
          current="$GITHUB_RUN_ID"
          artifacts_deleted=0
          caches_deleted=0
          runs_deleted=0
          failures=0

          delete_api() {
            local endpoint="$1"
            local label="$2"
            for attempt in 1 2 3; do
              if gh api --method DELETE "$endpoint" >/dev/null 2>&1; then
                return 0
              fi
              sleep "$attempt"
            done
            echo "::warning::$label could not be deleted after retries"
            failures=$((failures + 1))
            return 1
          }

          mapfile -t artifact_ids < <(gh api --paginate "/repos/$repo/actions/artifacts?per_page=100" --jq '.artifacts[].id' 2>/dev/null || true)
          for id in "${artifact_ids[@]}"; do
            if delete_api "/repos/$repo/actions/artifacts/$id" "artifact $id"; then
              artifacts_deleted=$((artifacts_deleted + 1))
            fi
          done

          mapfile -t cache_ids < <(gh api --paginate "/repos/$repo/actions/caches?per_page=100" --jq '.actions_caches[].id' 2>/dev/null || true)
          for id in "${cache_ids[@]}"; do
            if delete_api "/repos/$repo/actions/caches/$id" "cache $id"; then
              caches_deleted=$((caches_deleted + 1))
            fi
          done

          gh api --paginate "/repos/$repo/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | [.id,.workflow_id,.status,(.conclusion // "")] | @tsv' \
            > /tmp/runs.tsv

          declare -A kept_success
          while IFS=$'\t' read -r id workflow status conclusion; do
            [[ -z "$id" ]] && continue
            [[ "$id" == "$current" ]] && continue
            [[ "$status" != "completed" ]] && continue

            if [[ "$conclusion" == "success" ]]; then
              count="${kept_success[$workflow]:-0}"
              if (( count < 3 )); then
                kept_success[$workflow]=$((count + 1))
                continue
              fi
            fi

            if delete_api "/repos/$repo/actions/runs/$id" "workflow run $id"; then
              runs_deleted=$((runs_deleted + 1))
            fi
          done < /tmp/runs.tsv

          echo "::notice::Cleanup complete: $artifacts_deleted artifacts, $caches_deleted caches, $runs_deleted workflow runs deleted; $failures deletion failures. Kept the current run and up to three newest successful runs per workflow."
