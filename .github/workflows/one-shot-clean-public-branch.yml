name: One-shot clean public branch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-clean-public-branch.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Remove merged duplicate branch and this workflow
        shell: bash
        run: |
          set -euo pipefail
          extra='codex/refresh-public-system-contract'
          if git ls-remote --exit-code --heads origin "$extra" >/dev/null 2>&1; then
            git push origin --delete "$extra"
          fi
          rm .github/workflows/one-shot-clean-public-branch.yml
          git config user.name 'PeterSmart Link'
          git config user.email 'petersmartlink@gmail.com'
          git add -u .github/workflows/one-shot-clean-public-branch.yml
          git commit -m 'chore: finish branch cleanup'
          git push origin HEAD:main
